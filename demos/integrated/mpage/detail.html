<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MedBeacon - Alert Detail</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Segoe UI","SF Pro Text",-apple-system,Tahoma,sans-serif;color:#1c1c1e;background:#f2f2f7}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}

.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{color:#0a63c9;font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap}
.back:hover{text-decoration:underline}
.topbar h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0}
.topbar .who{font-size:12px;color:#6c7278}
.btn{font:13px inherit;padding:6px 14px;border-radius:7px;border:1px solid #c7c9cc;background:#fff;color:#1c1c1e;cursor:pointer}
.btn:hover{background:#f0f4f8;border-color:#0a63c9}
.btn.primary{background:#0a63c9;border-color:#0a63c9;color:#fff}
.btn.primary:hover{background:#0951a5}
.btn:disabled{background:#e9eaec;border-color:#dcdee0;color:#a0a4a8;cursor:default}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.07);margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;margin:0 0 12px}
.sub{font-size:12px;color:#6c7278}
.div{height:1px;background:#e8e9eb;margin:13px 0}

/* header */
.hdr .row1{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr .row1 h2{margin:0;font-size:18px}
.dot{width:11px;height:11px;border-radius:50%;background:#e02020;margin-left:auto}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.bdg{padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.bdg.fill{color:#fff}
.bdg.out{border-color:#c7c9cc;color:#3a3f44;background:#fff;font-weight:500}
.bdg.soft{background:#f0f1f3;border-color:#e2e4e6;font-weight:500;color:#5b6167}

/* score sections */
.scorehead{display:flex;align-items:baseline;gap:8px}
.scorehead .t{font-size:13.5px;font-weight:700}
.scorehead .v{margin-left:auto;font-size:14px;font-weight:700}
.interp{font-size:12px;color:#6c7278;margin:2px 0 9px}
.crit{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.mark{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex:0 0 17px}
.mark.y{background:#e02020}.mark.n{background:#c2c6ca}
.sofagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sofacell{background:#f6f7f9;border-radius:8px;padding:8px;text-align:center}
.sofacell .l{font-size:10.5px;color:#6c7278;display:block}
.sofacell .n{font-size:16px;font-weight:700}

/* criteria */
.flags{display:flex;gap:10px;margin-bottom:10px}
.flag{flex:1;background:#f6f7f9;border-radius:8px;padding:9px;text-align:center}
.flag .l{font-size:11px;color:#6c7278;display:block;margin-bottom:3px}
.flag .s{font-size:12.5px;font-weight:700}
.flag .s.y{color:#e02020}.flag .s.n{color:#6c7278}
.detail{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:#4a5057;padding:3px 0}
.detail .w{color:#f08000;flex:0 0 auto;font-weight:700}

.action{font-size:13px;font-weight:600}
.ai{display:flex;gap:10px;align-items:flex-start;background:#eef4fd;border:1px solid #d3e2f7;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#3a4a5c}
.kv{display:flex;font-size:12.5px;padding:3px 0}
.kv .k{color:#6c7278}.kv .v{margin-left:auto;font-weight:600}

/* interventions */
.iv{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #eef0f2}
.iv:last-child{border-bottom:none}
.ivicon{width:32px;height:32px;border-radius:8px;flex:0 0 32px;display:flex;align-items:center;justify-content:center}
.iv .body{flex:1;min-width:0}
.iv .t{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.iv .d{font-size:12.5px;color:#3a3f44}
.iv .r{font-size:11.5px;color:#6c7278;margin-top:2px}
.pri{font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:4px;color:#fff}
.pri.critical{background:#e02020}.pri.high{background:#f08000}.pri.moderate{background:#c9a227}

/* order bundle */
.tiers{display:flex;gap:8px;margin-bottom:12px}
.tier{flex:1;border:1px solid #d5d8db;border-radius:9px;padding:9px 11px;cursor:pointer;background:#fff}
.tier:hover{border-color:#0a63c9}
.tier.on{border-color:#0a63c9;background:#eef4fd;box-shadow:0 0 0 1px #0a63c9 inset}
.tier .n{font-size:12.5px;font-weight:700}
.tier .c{font-size:11px;color:#6c7278}
.cat{font-size:11px;font-weight:800;color:#6c7278;letter-spacing:.5px;text-transform:uppercase;margin:14px 0 5px}
.oi{display:flex;gap:10px;padding:9px;border:1px solid #e6e8ea;border-radius:9px;margin-bottom:7px;background:#fff}
.oi.sel{border-color:#0a63c9;background:#f7fbff}
.oi input[type=checkbox]{margin-top:2px}
.oi .body{flex:1;min-width:0}
.oi .n{font-size:12.5px;font-weight:600}
.oi .m{font-size:11.5px;color:#6c7278}
.fields{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:10.5px;color:#6c7278}
.fld input,.fld select{font:12px inherit;padding:3px 6px;border:1px solid #c7c9cc;border-radius:5px;background:#fff;min-width:118px}
.fld input.need{border-color:#f08000;background:#fffaf2}
.fld .req{color:#f08000;font-weight:700}
.bar{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid #e8e9eb}
.bar .msg{font-size:12px;color:#6c7278;flex:1}

/* tracking */
.tr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f2}
.tr:last-child{border-bottom:none}
.tr .body{flex:1;min-width:0}
.tr .n{font-size:12.5px;font-weight:600}
.tr .m{font-size:11.5px;color:#6c7278}
.st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.st.orange{background:#fdf0dd;color:#96590a}
.st.green{background:#e3f5e6;color:#1c6b2a}
.st.red{background:#fdeaea;color:#a51f1f}
.progress{height:6px;border-radius:3px;background:#eceef0;overflow:hidden;margin:4px 0 12px}
.progress i{display:block;height:100%;background:#0a63c9;width:0;transition:width .3s}
.hint{background:#fff8e8;border:1px solid #f0dfb8;border-radius:9px;padding:11px 13px;font-size:12.5px;color:#6b551d;margin-top:12px}
.empty{font-size:12.5px;color:#8a8f94;padding:8px 0}
</style>
</head>
<body>

<div class="wrap">

 '<div class="sub" style="font-size:12.5px;color:#4a5057">'+esc(d.rationale)+'</div><div class="div"></div>'+
 '<h2 style="margin-bottom:6px">Action Required</h2>'+
 '<div class="action" style="color:'+d.color+'">'+esc(d.action)+'</div>';

document.getElementById('confCard').innerHTML='<h2>Confidence Assessment</h2>'+
 '<div class="kv"><span class="k">Level</span><span class="v">'+d.conf+'</span></div>'+
 '<div class="sub" style="margin-top:6px">'+esc(d.confWhy)+'</div>';

document.getElementById('timeCard').innerHTML='<h2>Timeline</h2>'+
 '<div class="kv"><span class="k">Alert Created</span><span class="v">'+d.created+'</span></div>'+
 '<div class="kv"><span class="k">Processing Time</span><span class="v">'+d.ms.toFixed(1)+' ms</span></div>'+
 '<div class="kv"><span class="k">Source</span><span class="v">'+d.source+'</span></div>';

var IVBG={critical:'#fdeaea',high:'#fdf3e6',moderate:'#fbf7e4'};
var IVFG={critical:'#e02020',high:'#f08000',moderate:'#c9a227'};
document.getElementById('ivCard').innerHTML='<h2>Suggested Interventions</h2>'+
 d.iv.map(function(i){
   return '<div class="iv"><div class="ivicon" style="background:'+IVBG[i[3]]+';color:'+IVFG[i[3]]+'">'+
     '<svg width="18" height="18"><use href="#s-'+i[0]+'"/></svg></div><div class="body">'+
     '<div class="t">'+esc(i[1])+'<span class="pri '+i[3]+'">'+i[3].toUpperCase()+'</span></div>'+
     '<div class="d">'+esc(i[2])+'</div><div class="r">'+esc(i[4])+'</div></div></div>';
 }).join('');

/* ---- order bundle ---- */
function key(i,f){return curTier+'|'+i+'|'+f;}
function renderBundle(){
  var B=BUNDLES[curTier], html='<h2>Propose Orders</h2>';
  html+='<div class="tiers">'+TIER_ORDER.map(function(t){
    return '<div class="tier'+(t===curTier?' on':'')+'" data-tier="'+t+'"><div class="n">'+BUNDLES[t].name+
      '</div><div class="c">'+BUNDLES[t].items.length+' orders</div></div>';}).join('')+'</div>';
  var cats=[],seen={};
  B.items.forEach(function(it){ if(!seen[it[0]]){seen[it[0]]=1;cats.push(it[0]);} });
  cats.sort(function(a,b){ if(a==='Medications')return -1; if(b==='Medications')return 1; return a<b?-1:1; });
  cats.forEach(function(c){
    html+='<div class="cat">'+c+'</div>';
    B.items.forEach(function(it,i){
      if(it[0]!==c) return;
      var on=!!selected[curTier+'|'+i];
      html+='<div class="oi'+(on?' sel':'')+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'>'+
            '<div class="body"><div class="n">'+esc(it[1])+'</div><div class="m">'+esc(it[2])+'</div>';
      if(it[3].length){
        html+='<div class="fields">'+it[3].map(function(f,fi){
          var k=key(i,fi), v=fieldVals[k]!==undefined?fieldVals[k]:f[1];
          var need=f[2]&&!v;
          return '<div class="fld"><label>'+esc(f[0])+(f[2]?' <span class="req">*</span>':'')+'</label>'+
                 '<input type="text" data-k="'+k+'" value="'+esc(v)+'"'+(need?' class="need"':'')+
                 (f[2]&&!v?' placeholder="required"':'')+'></div>';
        }).join('')+'</div>';
      }
      html+='</div></div>';
    });
  });
  var sel=[],missing=0;
  B.items.forEach(function(it,i){
    if(!selected[curTier+'|'+i]) return;
    sel.push(i);
    it[3].forEach(function(f,fi){ var v=fieldVals[key(i,fi)]!==undefined?fieldVals[key(i,fi)]:f[1]; if(f[2]&&!v) missing++; });
  });
  var msg = !sel.length ? 'Select the orders to propose.'
          : missing ? sel.length+' selected · '+missing+' field'+(missing===1?'':'s')+' still need a value'
          : sel.length+' selected · ready to propose';
  html+='<div class="bar"><span class="msg">'+msg+'</span>'+
    '<button class="btn" id="selAll">Select all</button>'+
    '<button class="btn primary" id="propose"'+(!sel.length||missing?' disabled':'')+'>Propose '+(sel.length||'')+' Order'+(sel.length===1?'':'s')+'</button></div>';
  document.getElementById('bundleCard').innerHTML=html;
}
document.getElementById('bundleCard').addEventListener('change',function(e){
  var cb=e.target.closest('input[type=checkbox]');
  if(cb){ selected[curTier+'|'+cb.dataset.i]=cb.checked; renderBundle(); }
});
document.getElementById('bundleCard').addEventListener('input',function(e){
  var t=e.target.closest('input[data-k]');
  if(t){ fieldVals[t.dataset.k]=t.value; var a=document.activeElement===t; renderBundle();
         if(a){ var n=document.querySelector('input[data-k="'+t.dataset.k+'"]'); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);} } }
});
document.getElementById('bundleCard').addEventListener('click',function(e){
  var t=e.target.closest('[data-tier]');
  if(t){ curTier=t.dataset.tier; renderBundle(); return; }
  if(e.target.id==='selAll'){
    BUNDLES[curTier].items.forEach(function(_,i){ selected[curTier+'|'+i]=true; });
    renderBundle(); return;
  }
  if(e.target.id==='propose'){ doPropose(); }
});

function doPropose(){
  var B=BUNDLES[curTier];
  B.items.forEach(function(it,i){
    if(!selected[curTier+'|'+i]) return;
    if(proposed.some(function(p){return p.name===it[1]})) return;
    proposed.push({name:it[1],meta:it[2],cat:it[0],status:'Proposed'});
    selected[curTier+'|'+i]=false;
  });
  renderBundle(); renderTrack();
  // orders move to Signed only once the clinician signs them in PowerChart
  setTimeout(function(){
    proposed.forEach(function(p){ if(p.status==='Proposed') p.status='Pending Signature'; });
    renderTrack();
  },1200);
}
function stColor(s){
  s=s.toLowerCase();
  if(/signed|complete|active|matched/.test(s)) return 'green';
  if(/fail|error|reject|cancel/.test(s)) return 'red';
  return 'orange';
}
function renderTrack(){
  var el=document.getElementById('trackCard');
  if(!proposed.length){
    el.innerHTML='<h2>Proposed Orders</h2><div class="empty">Nothing proposed yet.</div>'; return;
  }
  var done=proposed.filter(function(p){return stColor(p.status)==='green'}).length;
  el.innerHTML='<h2>Proposed Orders</h2>'+
    '<div class="progress"><i style="width:'+Math.round(done/proposed.length*100)+'%"></i></div>'+
    proposed.map(function(p){
      return '<div class="tr"><div class="body"><div class="n">'+esc(p.name)+'</div><div class="m">'+esc(p.cat)+' · '+esc(p.meta)+'</div></div>'+
             '<span class="st '+stColor(p.status)+'">'+p.status+'</span></div>';
    }).join('')+
    '<div class="hint">Proposed orders do not fire on their own. They land in the patient’s ' +
    '<b>Orders</b> profile as unsigned proposals and in <b>Message Centre &#8250; Orders &#8250; Cosign Orders</b>, ' +
    'where a provider signs them in the normal PowerChart workflow.</div>';
}

document.getElementById('back').addEventListener('click',function(){ location.href='patient.html?mrn='+mrn; });
document.getElementById('ack').addEventListener('click',function(){
  this.textContent='Acknowledged'; this.disabled=true;
  document.querySelector('#hdrCard .dot').style.display='none';
});
window.addEventListener('message',function(e){ if(e.data&&e.data.type==='zoom') document.body.style.zoom=e.data.value/100; });

renderBundle(); renderTrack();
</script>
</body>
</html>
