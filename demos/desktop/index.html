<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/demos/desktop/medbeacon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="MedBeacon — clinical bed-board census and executive roll-up." />
    <title>MedBeacon</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('medbeacon.theme');
          if (!t || t === 'system') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        try {
          var z = localStorage.getItem('medbeacon.zoom');
          document.documentElement.style.setProperty('--wr-zoom', z || '1.1');
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/demos/desktop/assets/index-CkKJSAuw.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/desktop/assets/index-DYV-9JPn.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
